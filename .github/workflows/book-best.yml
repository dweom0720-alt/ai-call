name: 생각서재 베스트셀러 가져오기
on:
  push:
    paths:
      - "covers/best_req.txt"
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"
permissions:
  contents: write
jobs:
  best:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python covers/build_best.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add covers/best.json
          git commit -m "베스트셀러 저장" || echo "no change"
          git pull --rebase -q || true
          git push
