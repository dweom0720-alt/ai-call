<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<title>AI 영어 화상통화</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
  "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
<style>
:root{
  --navy:#0b1424; --navy2:#13213a; --card:#18284a; --line:#2a3d63;
  --gold:#d4ae5a; --text:#eef2f8; --sub:#9fb0cc; --red:#e5484d; --green:#3ccf8e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--text);
  font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;cursor:pointer}
.screen{display:none;min-height:100%}
.screen.on{display:flex}

/* ---------- 설정 화면 ---------- */
#setup{flex-direction:column;align-items:center;padding:24px 16px 40px}
.wrap{width:100%;max-width:520px}
h1{font-size:22px;margin:8px 0 4px}
h1 span{color:var(--gold)}
.lead{color:var(--sub);font-size:14px;margin:0 0 20px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sec h2{font-size:14px;color:var(--gold);margin:0 0 12px;font-weight:600;letter-spacing:.02em}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.opt{background:var(--navy2);border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;
  color:var(--text);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt small{color:var(--sub);font-size:11.5px;line-height:1.35}
.opt.sel{border-color:var(--gold);background:#1f2f52;box-shadow:0 0 0 2px rgba(212,174,90,.18)}
.opt svg{width:64px;height:70px}
.opt b{font-size:14px}
.g3 .opt b{font-size:13px;word-break:keep-all}
input[type=password],input[type=text],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:var(--navy2);color:var(--text);font-size:15px}
.hint{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.5}
.hint a{color:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.row+.row{border-top:1px solid var(--line)}
.row label{font-size:14px}
.row label small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#33476d;border-radius:20px;transition:.2s}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--gold)}
.sw input:checked+span:before{transform:translateX(20px)}
details summary{cursor:pointer;color:var(--sub);font-size:13px}
.start{width:100%;padding:16px;border:0;border-radius:14px;background:var(--gold);color:#1a1405;
  font-size:17px;font-weight:700;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.start:active{transform:scale(.99)}

/* ---------- 통화 화면 ---------- */
#call{flex-direction:column;position:fixed;inset:0;
  background:radial-gradient(120% 80% at 50% 30%,#1c3157 0%,#0b1424 70%)}
.top{padding:calc(env(safe-area-inset-top) + 14px) 16px 0;text-align:center}
.top .nm{font-size:20px;font-weight:700}
.top .meta{color:var(--sub);font-size:13px;margin-top:3px}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.spacer{flex:1}
.top,.bottom{position:relative;z-index:2}
.bottom{background:linear-gradient(to bottom,rgba(11,20,36,0) 0%,rgba(11,20,36,.85) 35%,#0b1424 100%);padding-top:28px}
.ava{position:relative;width:min(62vw,300px);aspect-ratio:200/220}
.ava svg{width:100%;height:100%;display:block}
.ring{position:absolute;left:50%;top:44%;width:105%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:3px solid transparent;transition:border-color .2s, box-shadow .2s;pointer-events:none}
.ring.talk{border-color:rgba(212,174,90,.7);box-shadow:0 0 40px rgba(212,174,90,.25)}
.ring.listen{border-color:rgba(60,207,142,.45)}
#self{z-index:2;position:absolute;top:calc(env(safe-area-inset-top) + 64px);right:12px;width:96px;height:128px;border-radius:12px;object-fit:cover;
  background:#000;border:2px solid var(--line);transform:scaleX(-1);display:none}
.status{text-align:center;font-size:13px;color:var(--sub);height:18px;margin-bottom:6px}
.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:0}
.subs{position:relative;z-index:2;min-height:112px;max-height:30vh;overflow:hidden;padding:0 18px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.subs p{margin:0;font-size:15.5px;line-height:1.45;padding:7px 11px;border-radius:12px;max-width:92%}
.subs p.ai{background:rgba(255,255,255,.08);align-self:flex-start}
.subs p.me{background:rgba(212,174,90,.16);align-self:flex-end;color:#f5e6c4}
.subs.off{visibility:hidden}
.ctrl{display:flex;justify-content:center;gap:18px;padding:16px 16px calc(env(safe-area-inset-bottom) + 22px)}
.cb{width:60px;height:60px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:10.5px;gap:2px}
.cb svg{width:24px;height:24px}
.cb.off{background:#fff;color:#0b1424}
.cb.end{background:var(--red);width:68px;height:68px}
.cb.end svg{width:30px;height:30px}
.err{position:absolute;inset:0;background:rgba(5,10,20,.9);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
.err.on{display:flex}
.err .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px}
.err h3{margin:0 0 8px;color:var(--gold)}
.err p{margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--text);white-space:pre-line}
.err code{display:block;font-size:11px;color:var(--sub);word-break:break-all;margin-bottom:14px}

/* ---------- 종료 화면 ---------- */
#done{flex-direction:column;align-items:center;padding:24px 16px 40px}
.log p{margin:0 0 8px;font-size:14px;line-height:1.5}
.log b{color:var(--gold);font-weight:600;margin-right:6px}
.log .me b{color:#9fd8bd}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn2{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--navy2);color:var(--text);font-weight:600}

#av3d{position:absolute;inset:0;z-index:1}
.stage::before{content:"";position:absolute;inset:-60px;filter:blur(22px);opacity:0;transition:opacity .6s}
.stage[data-bg]::before{opacity:1}
.stage[data-bg="home"]::before{background:
  radial-gradient(circle at 16% 24%, rgba(255,205,140,.75) 0 5%, rgba(255,205,140,0) 16%),
  radial-gradient(circle at 86% 18%, rgba(255,236,200,.5) 0 3%, rgba(255,236,200,0) 11%),
  radial-gradient(circle at 74% 62%, rgba(255,170,110,.32) 0 7%, rgba(255,170,110,0) 20%),
  linear-gradient(90deg, rgba(0,0,0,0) 55%, rgba(255,240,215,.18) 56% 78%, rgba(0,0,0,0) 79%),
  linear-gradient(180deg,#6b5646 0%,#4a3b31 50%,#2b231d 100%)}
.stage[data-bg="office"]::before{background:
  linear-gradient(90deg, rgba(205,225,255,.35) 0 22%, rgba(0,0,0,0) 23% 26%, rgba(205,225,255,.3) 27% 48%, rgba(0,0,0,0) 49%),
  radial-gradient(circle at 80% 30%, rgba(255,240,215,.35) 0 4%, rgba(255,240,215,0) 13%),
  radial-gradient(circle at 70% 75%, rgba(120,160,150,.35) 0 9%, rgba(120,160,150,0) 22%),
  linear-gradient(180deg,#56637a 0%,#3b4559 55%,#232a38 100%)}
.top{background:linear-gradient(to bottom,rgba(11,20,36,.7),rgba(11,20,36,0));padding-bottom:18px}
#av2d{display:none}
.stage.flat #av2d{display:block}
.stage.flat #av3d{display:none}
.load{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--sub);font-size:14px;z-index:2}
.load.on{display:flex}
.bar{width:180px;height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.thumb{width:64px;height:70px;border-radius:10px;background-repeat:no-repeat;background-color:#2a3550}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 12px;border-radius:20px;font-size:12.5px;display:none;z-index:3;white-space:nowrap}
.toast.on{display:block}
/* 아바타 애니메이션 */
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
</style>
</head>
<body>

<!-- ================= 설정 화면 ================= -->
<section id="setup" class="screen on">
 <div class="wrap">
  <h1>AI 영어 <span>화상통화</span></h1>
  <p class="lead">외국인 AI와 영상통화하듯 영어로 대화하세요.</p>

  <div class="sec">
   <h2>1. 통화 상대</h2>
   <div class="grid g2" id="charList"></div>
  </div>

  <div class="sec">
   <h2>2. 대화 모드</h2>
   <div class="grid g3" id="modeList"></div>
  </div>

  <div class="sec">
   <h2>3. 옵션</h2>
   <div class="row"><label>3D 실사 아바타<small>첫 통화 때 6~13MB 다운로드 (와이파이 권장)</small></label>
    <label class="sw"><input type="checkbox" id="opt3d"><span></span></label></div>
   <div class="row"><label>천천히, 쉬운 표현으로<small>초급~중급용 (권장)</small></label>
    <label class="sw"><input type="checkbox" id="optSlow"><span></span></label></div>
   <div class="row"><label>자막 보기<small>통화 중에도 켜고 끌 수 있음</small></label>
    <label class="sw"><input type="checkbox" id="optSubs"><span></span></label></div>
   <div class="row"><label>AI가 내 카메라 보기<small>무료 한도를 빨리 씀 · 기본 꺼짐</small></label>
    <label class="sw"><input type="checkbox" id="optVideo"><span></span></label></div>
  </div>

  <div class="sec">
   <h2>4. Gemini API 키</h2>
   <input type="password" id="key" placeholder="AIza로 시작하는 키 붙여넣기" autocomplete="off">
   <div class="hint">키는 이 기기의 브라우저에만 저장됩니다.<br>
    발급: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> → 'API 키 만들기'</div>
   <details style="margin-top:12px"><summary>고급 설정 (모델)</summary>
    <div style="margin-top:10px">
     <select id="model"></select>
     <input type="text" id="modelCustom" placeholder="직접 입력 (비워두면 위 선택 사용)" style="margin-top:8px">
     <div class="hint">연결 오류에 '모델'이 언급되면 다른 모델을 선택해 보세요.</div>
    </div>
   </details>
  </div>

  <button class="start" id="startBtn">
   <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
   통화 시작
  </button>
  <p class="hint" style="text-align:center">이어폰을 쓰면 AI가 자기 목소리를 듣고 끊기는 일이 줄어듭니다.</p>
 </div>
</section>

<!-- ================= 통화 화면 ================= -->
<section id="call" class="screen">
 <div class="top">
  <div class="nm" id="cName">Emma</div>
  <div class="meta"><span id="cMode"></span> · <span id="cTime">00:00</span></div>
 </div>
 <div class="stage">
  <video id="self" autoplay playsinline muted></video>
  <div id="av3d"></div>
  <div class="ava" id="av2d"><div class="ring" id="ring"></div><div id="avaHolder"></div></div>
  <div class="load" id="load"><span id="loadT">아바타 불러오는 중…</span><div class="bar"><i id="loadB"></i></div></div>
  <div class="toast" id="toast"></div>
 </div>
 <div class="spacer"></div>
 <div class="bottom">
 <div class="status" id="status">연결 중…</div>
 <div class="subs" id="subs"></div>
 <div class="ctrl">
  <button class="cb" id="micBtn" aria-label="마이크">
   <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>마이크</button>
  <button class="cb end" id="endBtn" aria-label="통화 종료">
   <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a1 1 0 0 1-1.41-.02L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.41.02c-.79-.73-1.68-1.36-2.66-1.85a1 1 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button>
  <button class="cb" id="camBtn" aria-label="카메라">
   <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>카메라</button>
  <button class="cb" id="subBtn" aria-label="자막" data-x="1">
   <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM4 12h4v2H4v-2zm10 6H4v-2h10v2zm6 0h-4v-2h4v2zm0-4H10v-2h10v2z"/></svg>자막</button>
 </div>
 </div>
 <div class="err" id="err"><div class="box">
  <h3 id="errT">연결 오류</h3><p id="errM"></p><code id="errC"></code>
  <button class="start" id="errBack">설정으로 돌아가기</button>
 </div></div>
</section>

<!-- ================= 종료 화면 ================= -->
<section id="done" class="screen">
 <div class="wrap">
  <h1>통화 <span>종료</span></h1>
  <p class="lead" id="dMeta"></p>
  <div class="sec"><h2>대화 기록</h2><div class="log" id="dLog"></div></div>
  <div class="btns">
   <button class="btn2" id="againBtn">다시 통화</button>
   <button class="btn2" id="homeBtn">처음으로</button>
  </div>
 </div>
</section>

function renderSetup(){
  $("charList").innerHTML = Object.entries(CHARS).map(([k,c]) =>
    `<button class="opt ${S.char===k?"sel":""}" data-char="${k}">${S.av3d
      ? (c.thumbSrc ? `<div class="thumb" style="background-image:url('${c.thumbSrc}');background-size:cover;background-position:center"></div>`
         : `<div class="thumb" style="background-image:url('${TH+c.thumb.img}');background-size:${c.thumb.size};background-position:${c.thumb.pos}"></div>`)
      : avatarSVG(c,true)}<b>${c.name}</b><small>${c.desc}</small></button>`).join("");
  $("modeList").innerHTML = Object.entries(MODES).map(([k,m]) =>
    `<button class="opt ${S.mode===k?"sel":""}" data-mode="${k}"><b>${m.label}</b><small>${m.desc}</small></button>`).join("");
  $("opt3d").checked = S.av3d; $("optSlow").checked = S.slow; $("optSubs").checked = S.subs; $("optVideo").checked = S.video;
  $("key").value = S.key || "";
  $("model").innerHTML = MODELS.map(m => `<option ${S.model===m?"selected":""}>${m}</option>`).join("");
  $("modelCustom").value = S.modelCustom || "";
}
document.addEventListener("click", e => {
  const ch = e.target.closest("[data-char]"); if (ch){ S.char = ch.dataset.char; saveS(); renderSetup(); }
  const md = e.target.closest("[data-mode]"); if (md){ S.mode = md.dataset.mode; saveS(); renderSetup(); }
});
["opt3d","optSlow","optSubs","optVideo"].forEach(id => $(id).addEventListener("change", () => {
  const was = S.av3d; S.av3d = $("opt3d").checked; if (was !== S.av3d) setTimeout(renderSetup);
  S.slow = $("optSlow").checked; S.subs = $("optSubs").checked; S.video = $("optVideo").checked; saveS();
}));
$("model").addEventListener("change", () => { S.model = $("model").value; saveS(); });
$("modelCustom").addEventListener("change", () => { S.modelCustom = $("modelCustom").value.trim(); saveS(); });

/* ===================== 시스템 프롬프트 ===================== */
function buildPrompt(){
  const c = CHARS[S.char], m = MODES[S.mode];
  const pace = S.slow
    ? "Speak SLOWLY and clearly, with simple everyday vocabulary and short sentences."
    : "Speak at a natural but clear pace.";
  return `You are ${c.name}, a native English speaker from ${c.from} with a natural ${c.accent} accent, on a live video call.
${USER_CTX}
${m.prompt(c)}
General rules:
- ${pace}
- Keep each turn short: 1 to 3 sentences. Never give long monologues.
- Ask one question at a time and wait for the answer.
- If the user speaks Korean, says "help", or seems stuck, briefly give a natural English way to say what they mean (you may add a very short Korean explanation), then continue in English.
- Stay in character as a person on a video call. Respond in English.
Natural turn-taking (very important, behave like a real phone/video call):
- Respond quickly. Start with a short natural reaction ("Oh nice!", "Hmm, I see.", "Really?") instead of long pauses.
- Keep turns short so the user can jump in at any time.
- If the user starts talking while you are speaking, stop immediately and listen. Do not finish your old sentence; respond to what they just said.
- If you both start talking at the same time, yield politely, e.g. "Oh, sorry, go ahead!"
- If the user pauses briefly while thinking ("um...", "uh..."), wait for them and maybe say "Take your time." Do not jump to a new topic.`;
}

const WORKLET = `
class Rec extends AudioWorkletProcessor{
  constructor(){super();this.r=sampleRate/16000;this.a=0;this.s=0;this.n=0;this.o=new Int16Array(800);this.i=0;this.pk=0;}
  process(inp){const ch=inp[0]&&inp[0][0];if(!ch)return true;
    for(let k=0;k<ch.length;k++){const x=ch[k];this.s+=x;this.n++;const ax=x<0?-x:x;if(ax>this.pk)this.pk=ax;this.a+=1;
      if(this.a>=this.r){this.a-=this.r;let v=this.s/this.n;this.s=0;this.n=0;v=v>1?1:v<-1?-1:v;
        this.o[this.i++]=v<0?v*0x8000:v*0x7fff;
        if(this.i>=this.o.length){const b=this.o.slice(0);this.port.postMessage({pcm:b.buffer,pk:this.pk},[b.buffer]);this.i=0;this.pk=0;}}}
    return true;}}
registerProcessor('rec',Rec);`;

function b64FromBuf(buf){
  const u = new Uint8Array(buf); let s = "";
  for (let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i,i+0x8000));
  return btoa(s);
}
function send(o){ if (ws && ws.readyState===1) ws.send(JSON.stringify(o)); }

  ready=false; ending=false; muted=false; subsOn=S.subs; transcript=[]; nextTime=0; sources.clear();

  $("cName").textContent = c.name; $("cMode").textContent = MODES[S.mode].label; $("cTime").textContent="00:00";
  $("avaHolder").innerHTML = avatarSVG(c,false);
  $("subs").innerHTML=""; $("subs").classList.toggle("off", !subsOn); $("subBtn").classList.toggle("off", !subsOn);
  $("micBtn").classList.remove("off"); $("camBtn").classList.add("off"); $("self").style.display="none";
  $("err").classList.remove("on");
  show("call"); setStatus("연결 중…");

  // 출력 오디오: 버튼을 누른 순간 만들어야 소리가 막히지 않음 (한 번 만들어 계속 재사용)
  const AC0 = window.AudioContext || window.webkitAudioContext;
  if (!outCtx){
    outCtx = new AC0({sampleRate:24000});
    analyser = outCtx.createAnalyser(); analyser.fftSize = 512; analyser.connect(outCtx.destination);
  }
  outCtx.resume().catch(()=>{});
  const avatarTask = S.av3d ? load3D(c) : Promise.resolve(false);

  try {
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  } catch(e){ return fail("마이크 권한 필요", "브라우저 주소창의 자물쇠 아이콘에서 마이크를 '허용'으로 바꾼 뒤 다시 시도해 주세요.", e.message); }

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    inCtx = new AC();
    const url = URL.createObjectURL(new Blob([WORKLET],{type:"application/javascript"}));
    await inCtx.audioWorklet.addModule(url);
    const src = inCtx.createMediaStreamSource(micStream);
    workletNode = new AudioWorkletNode(inCtx, "rec");
    const mute0 = inCtx.createGain(); mute0.gain.value = 0;
    src.connect(workletNode); workletNode.connect(mute0); mute0.connect(inCtx.destination);
    workletNode.port.onmessage = e => {
      if (!ready || muted) return;
      bargeIn(e.data.pk);
      send({realtimeInput:{audio:{data:b64FromBuf(e.data.pcm), mimeType:"audio/pcm;rate=16000"}}});
    };
    await inCtx.resume();
  } catch(e){ return fail("오디오 오류", "이 브라우저에서 오디오를 시작하지 못했습니다. 크롬 또는 삼성 인터넷 최신 버전에서 열어 주세요.", e.message); }

  try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e) {}

  use3D = await avatarTask;
  $("load").classList.remove("on");
  document.querySelector("#call .stage").classList.toggle("flat", !use3D);
  if (S.av3d && !use3D) toast(/^https?:/.test(c.avatar.url) ? "3D 아바타를 불러오지 못해 기본 아바타로 진행합니다" : `${c.avatar.url} 파일이 index.html과 같은 곳에 있어야 합니다`);
  if (ending) return;

  // 연결 시도 순서: 선택한 모델 → 나머지 모델 → (마지막) 목소리 설정 없이
  const first = (S.modelCustom || S.model || MODELS[0]).replace(/^models\//,"");
  const order = [first, ...MODELS.filter(m => m !== first)];
  attempts = order.map(m => ({model:m, voice:true, vad:true})).concat([{model:order[0], voice:true, vad:false}, {model:order[0], voice:false, vad:false}]);
  lastErr = null;
  connect(0, key, c);
  loop();
}

let attempts = [], lastErr = null;
function connect(i, key, c){
  if (ending) return;
  const a = attempts[i];
  setStatus(i ? `다른 AI 모델로 다시 연결 중… (${i+1}/${attempts.length})` : "연결 중…");
  const gen = { responseModalities:["AUDIO"] };
  if (a.voice) gen.speechConfig = { voiceConfig: { prebuiltVoiceConfig: { voiceName: c.voice } } };
  const sock = new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + encodeURIComponent(key));
  ws = sock;
  sock.onopen = () => send({setup:{
    model: "models/" + a.model,
    generationConfig: gen,
    systemInstruction: { parts:[{ text: buildPrompt() }] },
    inputAudioTranscription: {},
    outputAudioTranscription: {},
    ...(a.vad ? { realtimeInputConfig: {
      automaticActivityDetection: {
        startOfSpeechSensitivity: "START_SENSITIVITY_HIGH",
        endOfSpeechSensitivity: "END_SENSITIVITY_HIGH",
        prefixPaddingMs: 80,
        silenceDurationMs: S.slow ? 650 : 450
      },
      activityHandling: "START_OF_ACTIVITY_INTERRUPTS"
    }} : {})
  }});
  sock.onmessage = async ev => {
    let txt = ev.data; if (typeof txt !== "string") txt = await ev.data.text();
    let msg; try { msg = JSON.parse(txt); } catch(e){ return; }
    if (msg.setupComplete && (S.model !== a.model) && !S.modelCustom){ S.model = a.model; saveS(); }
    handle(msg);
  };
  sock.onerror = () => {};
  sock.onclose = e => {
    if (ending || sock !== ws) return;
    const r = (e.reason || "").toLowerCase();
    const fatal = r.includes("api key") || r.includes("api_key") || r.includes("quota") || r.includes("exhausted");
    if (!ready && !fatal && i + 1 < attempts.length){ lastErr = e; return connect(i + 1, key, c); }
    onDrop(e);
  };
}

function handle(msg){
  if (msg.setupComplete){
    ready = true; t0 = Date.now();
    timerId = setInterval(tick, 1000);
    setStatus("통화 중", true);
    send({clientContent:{turns:[{role:"user",parts:[{text:"(The video call has just connected. Greet me warmly in one or two sentences and start.)"}]}], turnComplete:true}});
    if (S.video) toggleCam();
    return;
  }
  const sc = msg.serverContent;
  if (sc){
    if (sc.interrupted) stopPlayback();
    if (sc.turnComplete && use3D && head) head.streamNotifyEnd();
    if (sc.modelTurn && sc.modelTurn.parts) for (const p of sc.modelTurn.parts){
      if (p.inlineData && p.inlineData.data) play(p.inlineData.data);
    }
    if (sc.inputTranscription && sc.inputTranscription.text) addT("me", sc.inputTranscription.text);
    if (sc.outputTranscription && sc.outputTranscription.text) addT("ai", sc.outputTranscription.text);
  }
  if (msg.goAway) setStatus("곧 연결 시간이 끝납니다", true);
}

/* ===================== 재생 + 입 모양 ===================== */
function play(b64){
  if (use3D && head) return play3D(b64);
  const bin = atob(b64), n = bin.length >> 1;
  const f = new Float32Array(n);
  for (let i=0;i<n;i++){ let v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1) << 8); if (v >= 0x8000) v -= 0x10000; f[i] = v / 32768; }
  const buf = outCtx.createBuffer(1, n, 24000); buf.copyToChannel(f, 0);
  const s = outCtx.createBufferSource(); s.buffer = buf; s.connect(analyser);
  const at = Math.max(outCtx.currentTime + 0.04, nextTime);
  s.start(at); nextTime = at + buf.duration;
  sources.add(s); s.onended = () => sources.delete(s);
}
function stopPlayback(){
  if (use3D && head){ try { head.streamInterrupt(); } catch(e){} streamMs = 0; }
  if (ducked){ ducked = false; const g = aiGain(); if (g) g.value = 1; }
  sources.forEach(s => { try { s.stop(); } catch(e){} }); sources.clear();
  nextTime = outCtx ? outCtx.currentTime : 0;
}
/* ---------- 끼어들기: 내가 말하면 AI 목소리를 즉시 줄임 (서버가 확인하면 완전히 멈춤) ---------- */
let loudRun = 0, quietRun = 0, ducked = false;
function aiGain(){ return (use3D && head) ? head.audioStreamGainNode && head.audioStreamGainNode.gain : null; }
function setDuck(on){
  if (on === ducked) return; ducked = on;
  const g = aiGain(); if (g && outCtx) g.setTargetAtTime(on ? 0.18 : 1, outCtx.currentTime, on ? 0.02 : 0.15);
}
function bargeIn(pk){
  const aiTalking = (use3D && head) ? !!head.isSpeaking : sources.size > 0;
  if (pk > 0.22){ loudRun++; quietRun = 0; } else { quietRun++; loudRun = 0; }
  if (aiTalking && loudRun >= 3) setDuck(true);          // 0.15초 이상 내 목소리
  if (ducked && (quietRun >= 14 || !aiTalking)) setDuck(false);
}

/* ---------- 3D 아바타 ---------- */
async function load3D(c){
  const st = document.querySelector("#call .stage");
  st.classList.remove("flat");
  $("load").classList.add("on"); $("loadB").style.width = "0%";
  $("loadT").textContent = `${c.name} 불러오는 중…`;
  try {
    if (!thMod) thMod = await import(TH + "modules/talkinghead.mjs");
    if (!head){
      head = new thMod.TalkingHead($("av3d"), {
        ttsEndpoint:"N/A", lipsyncModules:["en"], lipsyncLang:"en", audioCtx: outCtx,
        cameraView:"upper", cameraRotateEnable:false, cameraPanEnable:false, cameraZoomEnable:false,
        modelPixelRatio: Math.min(1, 2 / (window.devicePixelRatio || 1)), modelFPS: 30,
        lightAmbientIntensity: 2.4, lightDirectColor: 0xffeedd, lightDirectIntensity: 22,
        lightSpotIntensity: 12, lightSpotColor: 0xffb077,
        avatarMood:"happy", avatarSpeakingEyeContact:0.8, avatarListeningEyeContact:0.8
      });
    } else head.start();
    if (headUrl !== c.avatar.url){
      await head.showAvatar(Object.assign({lipsyncLang:"en"}, c.avatar), ev => {
        if (ev && ev.lengthComputable){
          const pct = Math.round(ev.loaded / ev.total * 100);
          $("loadB").style.width = pct + "%"; $("loadT").textContent = `${c.name} 불러오는 중… ${pct}%`;
        }
      });
      headUrl = c.avatar.url;
      if (c.recolor && head.armature) head.armature.traverse(o => {
        const col = o.isMesh && o.material && c.recolor[o.material.name];
        if (col !== undefined && col !== false){ o.material.map = null; o.material.color.setHex(col); o.material.needsUpdate = true; }
      });
    }
    st.dataset.bg = c.bg || "";
    fitView();
    await head.streamStart({sampleRate:24000, lipsyncType:"visemes", mood:"happy"});
    streamMs = 0;
    return true;
  } catch(e){
    console.error(e);
    return false;
  }
}

// 소리 크기·떨림으로 입 모양(비즘) 추정 → 60ms 단위
function makeVisemes(pcm, startMs){
  const W = 1440, out = {visemes:[], vtimes:[], vdurations:[]};
  let prevSilent = true, k = 0;
  for (let i=0; i+W <= pcm.length; i+=W){
    let sum=0, zc=0;
    for (let j=i; j<i+W; j++){ const v = pcm[j]/32768; sum += v*v; if (j>i && ((pcm[j]^pcm[j-1]) < 0)) zc++; }
    const rms = Math.sqrt(sum/W), zcr = zc/W, t = startMs + (i/24);
    if (rms < 0.018){ prevSilent = true; continue; }
    let v;
    if (prevSilent && Math.random() < 0.35) v = "PP";
    else if (zcr > 0.22) v = "SS";
    else if (zcr > 0.13) v = (k%2) ? "E" : "I";
    else if (rms > 0.09) v = (k%3===2) ? "O" : "aa";
    else v = ["E","aa","O","U","DD"][k%5];
    out.visemes.push(v); out.vtimes.push(Math.round(t)); out.vdurations.push(60);
    prevSilent = false; k++;
  }
  return out;
}
function play3D(b64){
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  const pcm = new Int16Array(u8.buffer, 0, u8.length >> 1);
  if (!head.isSpeaking) streamMs = 0;
  const vis = makeVisemes(pcm, streamMs);
  streamMs += pcm.length / 24;
  head.streamAudio(Object.assign({audio: u8.buffer}, vis));
}
// 세로 화면(폰)에서는 조금 멀리서, 얼굴이 위쪽에 오도록
function fitView(){
  if (!head) return;
  const el = $("av3d"), portrait = el.clientHeight > el.clientWidth * 1.15;
  try { head.setView("upper", portrait ? {cameraDistance:1.6, cameraY:0.55} : {cameraDistance:0, cameraY:0}); } catch(e){}
}
window.addEventListener("resize", () => setTimeout(fitView, 200));
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 4000); }

const tdata = new Float32Array(512);
function loop(){
  rafId = requestAnimationFrame(loop);
  if (!analyser) return;
  analyser.getFloatTimeDomainData(tdata);
  let sum=0; for (let i=0;i<tdata.length;i++) sum += tdata[i]*tdata[i];
  const rms = Math.sqrt(sum/tdata.length);
  const target = Math.min(1, rms*7);
  level += (target - level) * (target > level ? 0.6 : 0.25);
  const mouth = $("mouth"), smile = $("smile"), head = $("head");
  if (mouth){ mouth.setAttribute("ry", (0.5 + level*11).toFixed(2)); mouth.setAttribute("rx", (11 + level*3).toFixed(2)); }
  if (smile) smile.setAttribute("opacity", Math.max(0, 1 - level*3).toFixed(2));
  const talking = (use3D && head) ? !!head.isSpeaking : sources.size > 0;
  if (head) head.setAttribute("transform", talking ? `translate(0 ${(Math.sin(Date.now()/260)*1.4).toFixed(2)}) rotate(${(Math.sin(Date.now()/900)*1.2).toFixed(2)} 100 110)` : "");
  const ring = $("ring");
  ring.classList.toggle("talk", talking);
  ring.classList.toggle("listen", !talking && ready && !muted);
  if (ready && !ending) setStatus(muted ? "마이크 꺼짐" : talking ? "말하는 중…" : "듣고 있어요", !muted);
}

/* ===================== 자막 ===================== */
function addT(who, text){
  const last = transcript[transcript.length-1];
  if (last && last.who === who) last.text += text; else transcript.push({who, text});
  renderSubs();
}
function esc(s){ return s.replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }
function renderSubs(){
  $("subs").innerHTML = transcript.slice(-3).map(t => `<p class="${t.who}">${esc(t.text.trim())}</p>`).join("");
}

/* ===================== 버튼 ===================== */
function tick(){
  const s = Math.floor((Date.now()-t0)/1000);
  $("cTime").textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}
$("micBtn").onclick = () => {
  muted = !muted; $("micBtn").classList.toggle("off", muted);
  if (muted) send({realtimeInput:{audioStreamEnd:true}});
};
$("subBtn").onclick = () => { subsOn = !subsOn; $("subs").classList.toggle("off", !subsOn); $("subBtn").classList.toggle("off", !subsOn); };
$("camBtn").onclick = toggleCam;
async function toggleCam(){
  if (camStream){
    camStream.getTracks().forEach(t => t.stop()); camStream = null; clearInterval(frameId);
    $("self").style.display = "none"; $("camBtn").classList.add("off"); return;
  }
  try { camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:320, height:240}}); }
  catch(e){ alert("카메라 권한이 필요합니다."); return; }
  $("self").srcObject = camStream; $("self").style.display = "block"; $("camBtn").classList.remove("off");
  if (S.video){
    const cv = document.createElement("canvas"); cv.width = 320; cv.height = 240; const cx = cv.getContext("2d");
    frameId = setInterval(() => {
      if (!ready || !camStream) return;
      cx.drawImage($("self"), 0, 0, 320, 240);
      send({realtimeInput:{video:{data: cv.toDataURL("image/jpeg",0.6).split(",")[1], mimeType:"image/jpeg"}}});
    }, 2000);
  }
}
$("endBtn").onclick = () => endCall(true);
$("errBack").onclick = () => { cleanup(); renderSetup(); show("setup"); };
$("againBtn").onclick = startCall;
$("homeBtn").onclick = () => { renderSetup(); show("setup"); };
$("startBtn").onclick = startCall;

/* ===================== 종료 / 오류 ===================== */
function cleanup(){
  ending = true; ready = false;
  try { ws && ws.close(); } catch(e){}
  clearInterval(timerId); clearInterval(frameId); cancelAnimationFrame(rafId);
  [micStream, camStream].forEach(s => s && s.getTracks().forEach(t => t.stop())); camStream = null;
  try { inCtx && inCtx.close(); } catch(e){}
  stopPlayback(); sources.clear();
  if (head){ try { head.stop(); } catch(e){} }
  $("load").classList.remove("on");
  try { wakeLock && wakeLock.release(); } catch(e){}
}
function endCall(){
  const secs = t0 ? Math.floor((Date.now()-t0)/1000) : 0;
  cleanup();
  $("dMeta").textContent = `${CHARS[S.char].name} · ${MODES[S.mode].label} · ${Math.floor(secs/60)}분 ${secs%60}초`;
  $("dLog").innerHTML = transcript.length
    ? transcript.map(t => `<p class="${t.who}"><b>${t.who==="ai"?CHARS[S.char].name:"나"}</b>${esc(t.text.trim())}</p>`).join("")
    : `<p style="color:var(--sub)">기록된 대화가 없습니다.</p>`;
  show("done");
}
function fail(title, msg, code){
  $("errT").textContent = title; $("errM").textContent = msg; $("errC").textContent = code || "";
  $("err").classList.add("on"); setStatus("");
}
function onDrop(e){
  const r = (e.reason || "").toLowerCase();
  if (ready && t0 && Date.now()-t0 > 12*60*1000) return endCall();   // 세션 시간(약 15분) 만료
  let m;
  if (r.includes("api key") || r.includes("api_key")) m = "API 키가 올바르지 않습니다.\n설정 화면에서 키를 다시 붙여넣어 주세요.";
  else if (r.includes("quota") || r.includes("exhausted") || r.includes("rate")) m = "오늘 무료 사용 한도를 다 썼거나 잠시 사용량이 많습니다.\n잠시 후 또는 내일 다시 시도해 주세요. (요금은 청구되지 않습니다)";
  else if (r.includes("model") || r.includes("not found") || r.includes("not supported")) m = "선택한 모델을 쓸 수 없습니다.\n설정 → 고급 설정에서 다른 모델을 선택해 보세요.";
  else if (ready) m = "통화가 끊겼습니다. 다시 시도해 주세요.";
  else m = "AI 서버에 연결하지 못했습니다.\n인터넷 연결과 API 키를 확인해 주세요.";
  const keep = transcript.length > 0;
  fail("연결 종료", m, `code ${e.code}${e.reason ? " · " + e.reason : ""}`);
  if (keep) $("errBack").textContent = "설정으로 돌아가기";
}

renderSetup();
</script>
</body>
</html>
