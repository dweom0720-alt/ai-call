<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5A66">
<title>생각서재 오디오북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 생각서재와 같은 색·글꼴. 한 손으로 듣는 오디오북 플레이어 */
:root{
  --paper:#ECEFEA;--card:#F8FAF6;--ink:#1B2430;--muted:#5B6670;--line:#D2D8D0;
  --cloth:#1E5A66;--cloth-soft:#D9E7E8;--mark:#A9770F;--mark-soft:#F3E7C8;--danger:#A23B32;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;--f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-mono:"IBM Plex Mono",monospace;
}
:root.night{--paper:#0E1012;--card:#15181B;--ink:#CFC8BA;--muted:#857F73;--line:#25292D;--cloth:#86AEB4;--cloth-soft:#1A2629;--mark:#C49A45;--mark-soft:#2A2416;--danger:#C9776E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15.5px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;padding:env(safe-area-inset-top,0px) 16px calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cloth);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--f-display);font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.ib.on{background:var(--cloth);border-color:var(--cloth);color:var(--card)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;background:var(--cloth);color:var(--card)}
.btn.ghost{background:transparent;color:var(--cloth);border:1px solid var(--cloth)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn[disabled]{opacity:.45}
.muted{color:var(--muted)}.small{font-size:13.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.panel h2{font-family:var(--f-display);font-size:18px;margin:0 0 8px}
.panel > * + *{margin-top:10px}
.warn{background:var(--mark-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.err{border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lib button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.lib .t{font-family:var(--f-display);font-weight:700;font-size:17px}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.vc{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center}
.vc.on{border-color:var(--cloth);background:var(--cloth-soft)}
.vc b{font-size:14px}.vc span{font-size:12px;color:var(--muted);grid-column:1}
.vc .pv{grid-row:1 / span 2;grid-column:2;border:0;background:var(--cloth);color:var(--card);width:30px;height:30px;border-radius:50%;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--cloth);border-color:var(--cloth);color:var(--card)}
/* 본문 */
.toc{margin-top:14px}
.sec{margin-top:26px}
.sec h2{font-family:var(--f-display);font-size:22px;color:var(--cloth);margin:0 0 8px;line-height:1.4}
.para{font-family:var(--f-display);font-size:17px;line-height:1.95;margin:10px 0;padding:2px 6px;border-radius:6px;cursor:pointer}
.para.h{font-family:var(--f-body);font-weight:600;font-size:16px;color:var(--ink)}
.para.done{opacity:.6}
.para.now{background:var(--cloth-soft);opacity:1}
.para.wait{background:var(--mark-soft)}
/* 플레이어 */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:720px;margin:0 auto}
.pt{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.pt span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ctrl{display:grid;grid-template-columns:44px 44px 64px 44px 1fr;gap:8px;align-items:center;margin-top:6px}
.ctrl button{border:0;background:none;height:44px;border-radius:999px;font-size:18px;color:var(--cloth)}
.ctrl .play{background:var(--cloth);color:var(--card);font-size:20px}
.ctrl select{padding:7px 8px;font-size:13px}
.stat{font-size:12.5px;color:var(--mark);margin-top:4px;min-height:1em}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;background:var(--cloth);width:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="ttl">생각서재 오디오북</h1>
    <button class="ib" id="libBtn">책 목록</button>
    <button class="ib" id="setBtn">목소리·설정</button>
    <button class="ib" id="nightBtn" aria-label="야간 모드">야간</button>
  </header>
  <main id="main"></main>
</div>
<div class="player" id="player" hidden><div class="in">
  <div class="pt"><span id="pnow">-</span><span id="ppos"></span></div>
  <div class="track"><i id="ptr"></i></div>
  <div class="ctrl">
    <button id="prev" aria-label="이전 문단">⏮</button>
    <button id="back15" aria-label="15초 뒤로">↺</button>
    <button id="play" class="play" aria-label="재생">▶</button>
    <button id="next" aria-label="다음 문단">⏭</button>
    <select id="rate" aria-label="속도"><option value="0.9">0.9배</option><option value="1" selected>1배</option><option value="1.15">1.15배</option><option value="1.3">1.3배</option><option value="1.5">1.5배</option></select>
  </div>
  <div class="stat" id="stat"></div>
</div></div>
<audio id="au" preload="auto"></audio>

<script>
/* ===== 설정 ===== */
const VOICES=[
 ["Sulafat","따뜻한","여"],["Vindemiatrix","다정한","여"],["Achernar","부드럽고 낮은","여"],["Gacrux","성숙한","여"],["Kore","단단한","여"],["Aoede","산뜻한","여"],["Leda","젊은","여"],["Despina","부드러운","여"],["Callirrhoe","편안한","여"],["Erinome","맑은","여"],["Zephyr","밝은","여"],["Autonoe","밝은","여"],["Laomedeia","경쾌한","여"],["Pulcherrima","힘 있는","여"],
 ["Charon","또렷한 설명조","남"],["Schedar","고른","남"],["Sadaltager","지적인","남"],["Iapetus","맑은","남"],["Algieba","부드러운","남"],["Rasalgethi","또렷한","남"],["Orus","단단한","남"],["Alnilam","단단한","남"],["Umbriel","편안한","남"],["Achird","친근한","남"],["Enceladus","숨결 있는","남"],["Algenib","허스키한","남"],["Zubenelgenubi","캐주얼한","남"],["Puck","경쾌한","남"],["Fenrir","활기찬","남"],["Sadachbia","생기 있는","남"]];
const STYLES=[
 ["오디오북","차분하고 따뜻한 오디오북 낭독. 문장 사이에 자연스럽게 숨을 쉬고, 중요한 말은 살짝 힘을 주어 천천히 읽는다."],
 ["라디오","늦은 밤 라디오 진행자처럼 다정하고 편안하게, 듣는 사람에게 말을 건네듯 읽는다."],
 ["강의","강의하듯 또렷하고 자신 있게, 핵심 문장은 강조하며 읽는다."],
 ["잠자리","잠들기 전처럼 낮고 잔잔하게, 아주 천천히 속삭이듯 읽는다."]];
const MODELS=[["gemini-3.8-flash-tts","가장 자연스러움"],["gemini-3.8-flash-lite-tts","빠르고 한도 넉넉"]];
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}
const CF=Object.assign({key:"",voice:"Sulafat",style:0,model:MODELS[0][0],rate:1,night:false,schema:"new"},JSON.parse(lsGet("bookvoice")||"{}"));
if(!CF.key){try{const a=JSON.parse(lsGet("aicall")||"{}");if(a.key)CF.key=a.key}catch(_){}}
const saveCF=()=>lsSet("bookvoice",JSON.stringify(CF));
document.documentElement.classList.toggle("night",!!CF.night);

/* ===== 저장소(IndexedDB): 책·만든 음성 ===== */
let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise((ok,no)=>{const r=indexedDB.open("bookvoice",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("books");d.createObjectStore("audio")};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return dbp}
async function dget(st,k){const d=await idb();return new Promise((ok,no)=>{const r=d.transaction(st).objectStore(st).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function dput(st,k,v){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction(st,"readwrite");t.objectStore(st).put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
async function dall(st){const d=await idb();return new Promise((ok,no)=>{const r=d.transaction(st).objectStore(st).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function ddel(st,k){const d=await idb();return new Promise(ok=>{const t=d.transaction(st,"readwrite");t.objectStore(st).delete(k);t.oncomplete=()=>ok()})}

/* ===== 책 받기: 생각서재가 #b= 로 압축해 보냄 ===== */
function b64uToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function inflate(bytes){const ds=new DecompressionStream("deflate-raw");const out=new Blob([bytes]).stream().pipeThrough(ds);return await new Response(out).text()}
async function importFromHash(){
  const m=location.hash.match(/[#&]b=([^&]+)/);if(!m)return null;
  try{const txt=await inflate(b64uToBytes(m[1]));const bk=JSON.parse(txt);if(!bk.id||!Array.isArray(bk.sections))throw 0;
    const old=await dget("books",bk.id);const sp=location.hash.match(/[#&]s=(\d+)/),pp=location.hash.match(/[#&]p=(\d+)/);
    bk.pos=(sp?{s:+sp[1],p:pp?+pp[1]:0}:(old&&old.pos))||{s:0,p:0};bk.added=Date.now();
    await dput("books",bk.id,bk);history.replaceState(null,"",location.pathname);return bk.id;
  }catch(e){toastStat("책을 불러오지 못했습니다. 생각서재에서 다시 'AI 성우로 듣기'를 눌러 주세요.");return null}
}

/* ===== 화면 ===== */
const $=id=>document.getElementById(id);
function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const[k,v]of Object.entries(a)){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));return e}
const ST={view:"lib",book:null,flat:[],cur:0,playing:false,url:null,busy:new Map()};
function toastStat(t){$("stat").textContent=t||""}

async function showLib(){
  ST.view="lib";stop();window.scrollTo(0,0);$("player").hidden=true;$("ttl").textContent="생각서재 오디오북";
  const books=(await dall("books")).sort((a,z)=>(z.last||z.added||0)-(a.last||a.added||0));
  const m=$("main");m.replaceChildren(
    !CF.key?keyPanel(true):null,
    h("section",{class:"panel"},h("h2",null,"내 오디오북"),
      books.length?h("div",{class:"lib"},...books.map(b=>h("button",{onclick:()=>openBook(b.id)},h("div",{class:"t"},b.title),h("div",{class:"muted small"},[b.author,`${b.sections.length}개 장`,b.pos&&b.pos.s?`이어 듣기: ${(b.sections[b.pos.s]||{}).title||""}`:"처음부터"].filter(Boolean).join(" · ")))))
      :h("p",{class:"muted"},"아직 책이 없습니다. 생각서재의 '책 전체보기'에서 '듣기 › AI 성우로 듣기'를 누르면 책이 이곳으로 넘어옵니다.")),
    books.length?h("p",{class:"muted small"},"만든 음성은 이 기기에 저장되어, 다시 들을 때는 무료 한도를 쓰지 않습니다."):null);
}
function keyPanel(first){
  const inp=h("input",{type:"password",placeholder:"AIza로 시작하는 Gemini API 키",value:CF.key||"",autocomplete:"off"});
  return h("section",{class:"panel"},h("h2",null,first?"처음 한 번만: Gemini API 키":"Gemini API 키"),
    h("p",{class:"small"},"Google의 Gemini AI 음성으로 사람처럼 읽어 줍니다. 무료 키는 aistudio.google.com 에서 ‘Get API key’로 1분 안에 만들 수 있습니다. 키는 이 기기에만 저장되고 Google에만 보내집니다."),
    inp,h("div",{class:"row"},h("button",{class:"btn",onclick:()=>{CF.key=inp.value.trim();saveCF();toastStat("");ST.view==="lib"?showLib():showSettings()}},"저장"),h("a",{href:"https://aistudio.google.com/apikey",target:"_blank",rel:"noopener",class:"small"},"키 만들러 가기")));
}
function showSettings(){
  window.scrollTo(0,0);if(ST.view!=="set")ST.prevView=ST.view;ST.view="set";$("ttl").textContent="목소리·설정";
  const vgrid=h("div",{class:"voices"},...VOICES.map(([n,d,g])=>h("div",{class:"vc"+(CF.voice===n?" on":""),role:"button",tabindex:"0",onclick:e=>{if(e.target.closest(".pv"))return;CF.voice=n;saveCF();clearAhead();showSettings()}},
    h("b",null,n),h("span",null,`${g}성 · ${d}`),h("button",{class:"pv","aria-label":`${n} 들어 보기`,onclick:()=>preview(n)},"▶"))));
  $("main").replaceChildren(
    h("section",{class:"panel"},h("h2",null,"목소리 고르기"),h("p",{class:"muted small"},"▶로 미리 들어 보고 마음에 드는 목소리를 누르세요. 오디오북에는 Sulafat·Vindemiatrix·Gacrux(여), Charon·Schedar·Sadaltager(남)가 잘 어울립니다."),vgrid),
    h("section",{class:"panel"},h("h2",null,"읽는 분위기"),h("div",{class:"chips"},...STYLES.map(([l],i)=>h("button",{class:"chip"+(CF.style===i?" on":""),onclick:()=>{CF.style=i;saveCF();clearAhead();showSettings()}},l))),h("p",{class:"muted small"},STYLES[CF.style][1])),
    h("section",{class:"panel"},h("h2",null,"음성 모델"),h("div",{class:"chips"},...MODELS.map(([id,l])=>h("button",{class:"chip"+(CF.model===id?" on":""),onclick:()=>{CF.model=id;saveCF();clearAhead();showSettings()}},l))),h("p",{class:"muted small"},"무료 한도에 자주 걸리면 ‘빠르고 한도 넉넉’으로 바꾸세요.")),
    keyPanel(false),
    h("div",{class:"row",style:"margin-top:16px"},h("button",{class:"btn ghost",onclick:()=>ST.prevView==="book"&&ST.book?(renderBook(),scrollToCur(false)):showLib()},"돌아가기")));
}

/* ===== 책 화면 ===== */
async function openBook(id){
  const b=await dget("books",id);if(!b){showLib();return}
  ST.book=b;ST.flat=[];b.sections.forEach((s,si)=>s.paras.forEach((p,pi)=>ST.flat.push({si,pi,t:p.t,h:!!p.h,sec:s.title})));
  ST.cur=Math.max(0,ST.flat.findIndex(x=>x.si===(b.pos||{}).s&&x.pi===(b.pos||{}).p));
  b.last=Date.now();dput("books",b.id,b);
  renderBook();$("player").hidden=false;updPlayer();
  requestAnimationFrame(()=>scrollToCur(false));
}
function renderBook(){
  ST.view="book";const b=ST.book;$("ttl").textContent=b.title;
  const toc=h("select",{"aria-label":"장 이동",onchange:e=>{const si=+e.target.value;const i=ST.flat.findIndex(x=>x.si===si);if(i>=0)jump(i)}},...b.sections.map((s,i)=>h("option",{value:i,selected:i===ST.flat[ST.cur].si?true:null},s.title)));
  let k=0;
  const secs=b.sections.map((s,si)=>h("section",{class:"sec"},h("h2",null,s.title),...s.paras.map(p=>{const i=k++;return h("p",{class:"para"+(p.h?" h":""),"data-i":i,onclick:()=>jump(i)},p.t)})));
  $("main").replaceChildren(h("div",{class:"toc"},h("div",{class:"muted small"},b.author||""),toc),...secs,h("p",{class:"muted small",style:"margin-top:30px"},"문단을 누르면 그곳부터 읽습니다."));
  markCur();
}
function markCur(){document.querySelectorAll(".para").forEach(e=>{const i=+e.dataset.i;e.classList.toggle("now",i===ST.cur);e.classList.toggle("done",i<ST.cur);e.classList.toggle("wait",ST.busy.has(i)&&i!==ST.cur)})}
function scrollToCur(smooth){const e=document.querySelector(`.para[data-i="${ST.cur}"]`);if(!e)return;const r=e.getBoundingClientRect();const top=70,bot=window.innerHeight-$("player").offsetHeight-20;if(r.top<top||r.bottom>bot)window.scrollTo({top:window.scrollY+r.top-140,behavior:smooth?"smooth":"auto"})}
function savePos(){const b=ST.book;if(!b)return;const x=ST.flat[ST.cur];b.pos={s:x.si,p:x.pi};dput("books",b.id,b)}

/* ===== Gemini 음성 만들기 ===== */
function speakableText(t){return String(t).replace(/\(([^()]*[㐀-鿿][^()]*)\)/g,"").replace(/[「」『』《》〈〉“”"]/g,"").replace(/\s*[—–]\s*/g,", ").replace(/\s*·\s*/g,", ").replace(/\s*→\s*/g,", 그다음 ").replace(/(\d)\s*~\s*(\d)/g,"$1에서 $2").replace(/\s{2,}/g," ").trim()}
async function sha(s){const b=await crypto.subtle.digest("SHA-1",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function wavFromPcm(pcm,rate){const n=pcm.length,buf=new ArrayBuffer(44+n),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n,true);new Uint8Array(buf,44).set(pcm);return new Blob([buf],{type:"audio/wav"})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function tts(text,voice,styleIdx,model){
  if(!CF.key)throw Object.assign(new Error("키 없음"),{code:"nokey"});
  const style=STYLES[styleIdx][1];
  const bodyNew={contents:[{role:"user",parts:[{text,speech_metadata:{style}}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{voice}}}};
  const bodyOld={contents:[{role:"user",parts:[{text:`${style}\n\n${text}`}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}};
  for(let attempt=0;attempt<4;attempt++){
    const body=CF.schema==="old"?bodyOld:bodyNew;
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":CF.key},body:JSON.stringify(body)});
    if(r.status===429){const j=await r.json().catch(()=>({}));const d=((j.error&&j.error.details)||[]).find(x=>x.retryDelay);const sec=d?parseInt(d.retryDelay):20+attempt*20;toastStat(`무료 사용 한도에 잠시 걸렸습니다. ${sec}초 뒤 이어서 만듭니다…`);await sleep(sec*1000);continue}
    if(r.status===400&&CF.schema!=="old"){const j=await r.json().catch(()=>({}));const msg=(j.error&&j.error.message)||"";if(/speech_metadata|voice|Unknown name|Invalid JSON/i.test(msg)){CF.schema="old";saveCF();continue}throw Object.assign(new Error(msg||"요청 오류"),{code:"bad"})}
    if(r.status===404&&model!==MODELS[1][0]){model=MODELS[1][0];continue}
    if(r.status===401||r.status===403){throw Object.assign(new Error("API 키를 확인해 주세요"),{code:"key"})}
    if(!r.ok){const j=await r.json().catch(()=>({}));throw Object.assign(new Error((j.error&&j.error.message)||("오류 "+r.status)),{code:"http"})}
    const j=await r.json();const part=((((j.candidates||[])[0]||{}).content||{}).parts||[]).find(p=>p.inlineData||p.inline_data);
    if(!part)throw Object.assign(new Error("음성이 오지 않았습니다"),{code:"empty"});
    const d=part.inlineData||part.inline_data;const bin=atob(d.data);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    toastStat("");
    if(u[0]===0x52&&u[1]===0x49&&u[2]===0x46&&u[3]===0x46)return new Blob([u],{type:"audio/wav"});
    const rm=/rate=(\d+)/.exec(d.mimeType||d.mime_type||"");return wavFromPcm(u,rm?+rm[1]:24000);
  }
  throw Object.assign(new Error("무료 한도를 다 썼습니다. 잠시 후 다시 시도하거나 설정에서 ‘빠르고 한도 넉넉’ 모델로 바꿔 주세요."),{code:"quota"});
}
async function audioFor(i){
  const x=ST.flat[i];if(!x)return null;
  const text=speakableText(x.t);if(!text)return null;
  const key=await sha([CF.model,CF.voice,CF.style,text].join("|"));
  const hit=await dget("audio",key);if(hit)return hit;
  if(ST.busy.has(i))return ST.busy.get(i);
  const p=(async()=>{const blob=await tts(text,CF.voice,CF.style,CF.model);await dput("audio",key,blob);return blob})();
  ST.busy.set(i,p);markCur();
  try{return await p}finally{ST.busy.delete(i);markCur()}
}
function prefetch(){for(const d of [1,2]){const i=ST.cur+d;if(i<ST.flat.length&&!ST.busy.has(i))audioFor(i).catch(()=>{})}}
function clearAhead(){ST.busy.clear()}

/* ===== 재생 ===== */
const au=$("au");
async function playCur(){
  ST.playing=true;updPlayer();markCur();scrollToCur(true);savePos();
  const myCur=ST.cur;
  try{
    toastStat(ST.busy.has(myCur)?"":"목소리를 만드는 중…");
    const blob=await audioFor(myCur);
    if(!ST.playing||ST.cur!==myCur)return;
    toastStat("");
    if(!blob){next();return}
    if(ST.url)URL.revokeObjectURL(ST.url);ST.url=URL.createObjectURL(blob);
    au.src=ST.url;au.playbackRate=CF.rate;au.preservesPitch=true;
    await au.play();prefetch();mediaMeta();
  }catch(e){ST.playing=false;updPlayer();toastStat(e.code==="nokey"||e.code==="key"?"Gemini API 키를 넣어 주세요 (목소리·설정).":e.message);if(e.code==="nokey"||e.code==="key")showSettings()}
}
au.addEventListener("ended",()=>{if(!ST.playing)return;const x=ST.flat[ST.cur];setTimeout(next,x&&x.h?500:250)});
au.addEventListener("timeupdate",()=>{if(au.duration)$("ptr").style.width=(au.currentTime/au.duration*100)+"%"});
function next(){if(ST.cur>=ST.flat.length-1){stop();toastStat("끝까지 들었습니다.");return}ST.cur++;savePos();ST.playing?playCur():(markCur(),updPlayer(),scrollToCur(true))}
function prev(){ST.cur=Math.max(0,ST.cur-1);savePos();ST.playing?playCur():(markCur(),updPlayer(),scrollToCur(true))}
function jump(i){ST.cur=i;savePos();au.pause();playCur()}
function stop(){ST.playing=false;au.pause();updPlayer()}
function toggle(){if(ST.playing){ST.playing=false;au.pause();updPlayer()}else if(au.src&&au.currentTime>0&&!au.ended&&ST.loadedFor===ST.cur){ST.playing=true;au.play();updPlayer()}else playCur()}
au.addEventListener("play",()=>{ST.loadedFor=ST.cur});
function updPlayer(){
  if(!ST.book)return;const x=ST.flat[ST.cur]||{};
  $("pnow").textContent=x.sec||"";$("ppos").textContent=`${ST.cur+1} / ${ST.flat.length}`;
  $("play").textContent=ST.playing?"❚❚":"▶";$("play").setAttribute("aria-label",ST.playing?"일시정지":"재생");
  $("rate").value=String(CF.rate);
}
$("play").onclick=toggle;$("next").onclick=()=>{au.pause();next()};$("prev").onclick=()=>{au.pause();prev()};
$("back15").onclick=()=>{if(au.currentTime>3)au.currentTime=Math.max(0,au.currentTime-15);else prev()};
$("rate").onchange=e=>{CF.rate=+e.target.value;saveCF();au.playbackRate=CF.rate};
function mediaMeta(){if(!("mediaSession" in navigator)||!ST.book)return;const x=ST.flat[ST.cur];
  navigator.mediaSession.metadata=new MediaMetadata({title:x.sec,artist:ST.book.title,album:"생각서재 오디오북"});
  navigator.mediaSession.setActionHandler("play",toggle);navigator.mediaSession.setActionHandler("pause",toggle);
  navigator.mediaSession.setActionHandler("nexttrack",()=>{au.pause();next()});navigator.mediaSession.setActionHandler("previoustrack",()=>{au.pause();prev()})}

/* 미리 듣기 */
async function preview(v){
  toastStat(`${v} 목소리를 만드는 중…`);$("player").hidden=!ST.book;
  try{const key=await sha(["pv",CF.model,v,CF.style].join("|"));let blob=await dget("audio",key);
    if(!blob){blob=await tts("사람을 움직이는 힘은 말솜씨가 아니라, 상대를 먼저 듣는 데서 나옵니다. 오늘은 그 이야기를 천천히 나눠 보겠습니다.",v,CF.style,CF.model);await dput("audio",key,blob)}
    stop();const u=URL.createObjectURL(blob);au.src=u;au.playbackRate=CF.rate;await au.play();toastStat(`${v} 미리 듣기`);
  }catch(e){toastStat(e.message)}
}

$("libBtn").onclick=showLib;$("setBtn").onclick=showSettings;
$("nightBtn").onclick=()=>{CF.night=!CF.night;saveCF();document.documentElement.classList.toggle("night",CF.night);$("nightBtn").classList.toggle("on",CF.night)};
$("nightBtn").classList.toggle("on",!!CF.night);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")savePos()});

window.addEventListener("hashchange",async()=>{const id=await importFromHash();if(id)openBook(id)});
(async()=>{
  const id=await importFromHash();
  if(id)openBook(id);else showLib();
  if(id&&!CF.key)setTimeout(showSettings,400);
})();
</script>
