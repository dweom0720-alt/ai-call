<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5A66">
<title>생각서재 오디오북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 생각서재와 같은 색·글꼴. 한 손으로 듣는 오디오북 플레이어 */
:root{
  --paper:#ECEFEA;--card:#F8FAF6;--ink:#1B2430;--muted:#5B6670;--line:#D2D8D0;
  --cloth:#1E5A66;--cloth-soft:#D9E7E8;--mark:#A9770F;--mark-soft:#F3E7C8;--danger:#A23B32;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;--f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-mono:"IBM Plex Mono",monospace;
}
:root.night{--paper:#0E1012;--card:#15181B;--ink:#CFC8BA;--muted:#857F73;--line:#25292D;--cloth:#86AEB4;--cloth-soft:#1A2629;--mark:#C49A45;--mark-soft:#2A2416;--danger:#C9776E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15.5px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;padding:env(safe-area-inset-top,0px) 16px calc(150px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cloth);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--f-display);font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.ib.on{background:var(--cloth);border-color:var(--cloth);color:var(--card)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;background:var(--cloth);color:var(--card)}
.btn.ghost{background:transparent;color:var(--cloth);border:1px solid var(--cloth)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn[disabled]{opacity:.45}
.muted{color:var(--muted)}.small{font-size:13.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.panel h2{font-family:var(--f-display);font-size:18px;margin:0 0 8px}
.panel > * + *{margin-top:10px}
.warn{background:var(--mark-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.err{border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lib button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.lib .t{font-family:var(--f-display);font-weight:700;font-size:17px}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.vc{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center}
.vc.on{border-color:var(--cloth);background:var(--cloth-soft)}
.vc b{font-size:14px}.vc span{font-size:12px;color:var(--muted);grid-column:1}
.vc .pv{grid-row:1 / span 2;grid-column:2;border:0;background:var(--cloth);color:var(--card);width:30px;height:30px;border-radius:50%;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--cloth);border-color:var(--cloth);color:var(--card)}
.engs{display:grid;gap:8px}
.eng{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.eng.on{border-color:var(--cloth);background:var(--cloth-soft);box-shadow:inset 0 0 0 1px var(--cloth)}
.eng b{font-size:15px}.eng span{font-size:12.5px;color:var(--muted)}.eng .need{color:var(--mark);font-weight:400}.eng .use{color:var(--cloth);font-family:var(--f-mono);font-size:12px}
.steps{padding-left:20px;margin:6px 0}.steps li{margin-top:6px}.steps a{color:var(--cloth);font-weight:600}
/* 본문 */
.toc{margin-top:14px}
.sec{margin-top:26px}
.sec h2{font-family:var(--f-display);font-size:22px;color:var(--cloth);margin:0 0 8px;line-height:1.4}
.para{font-family:var(--f-display);font-size:17px;line-height:1.95;margin:10px 0;padding:2px 6px;border-radius:6px;cursor:pointer}
.para.h{font-family:var(--f-body);font-weight:600;font-size:16px;color:var(--ink)}
.para.done{opacity:.6}
.para.now{background:var(--cloth-soft);opacity:1}
.para.wait{background:var(--mark-soft)}
/* 플레이어 */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:720px;margin:0 auto}
.pt{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.pt span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ctrl{display:grid;grid-template-columns:44px 44px 64px 44px 1fr;gap:8px;align-items:center;margin-top:6px}
.ctrl button{border:0;background:none;height:44px;border-radius:999px;font-size:18px;color:var(--cloth)}
.ctrl .play{background:var(--cloth);color:var(--card);font-size:20px}
.ctrl select{padding:7px 8px;font-size:13px}
.stat{font-size:12.5px;color:var(--mark);margin-top:4px;min-height:1em}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;background:var(--cloth);width:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="ttl">생각서재 오디오북</h1>
    <button class="ib" id="libBtn">책 목록</button>
    <button class="ib" id="setBtn">목소리·설정</button>
    <button class="ib" id="nightBtn" aria-label="야간 모드">야간</button>
  </header>
  <main id="main"></main>
</div>
<div class="player" id="player" hidden><div class="in">
  <div class="pt"><span id="pnow">-</span><span id="ppos"></span></div>
  <div class="track"><i id="ptr"></i></div>
  <div class="ctrl">
    <button id="prev" aria-label="이전 문단">⏮</button>
    <button id="back15" aria-label="15초 뒤로">↺</button>
    <button id="play" class="play" aria-label="재생">▶</button>
    <button id="next" aria-label="다음 문단">⏭</button>
    <select id="rate" aria-label="속도"><option value="0.9">0.9배</option><option value="1" selected>1배</option><option value="1.15">1.15배</option><option value="1.3">1.3배</option><option value="1.5">1.5배</option></select>
  </div>
  <div class="stat" id="stat"></div>
</div></div>
<audio id="au" preload="auto"></audio>

<script>
/* ===== 설정 ===== */
const VOICES=[
 ["Sulafat","따뜻한","여"],["Vindemiatrix","다정한","여"],["Achernar","부드럽고 낮은","여"],["Gacrux","성숙한","여"],["Kore","단단한","여"],["Aoede","산뜻한","여"],["Leda","젊은","여"],["Despina","부드러운","여"],["Callirrhoe","편안한","여"],["Erinome","맑은","여"],["Zephyr","밝은","여"],["Autonoe","밝은","여"],["Laomedeia","경쾌한","여"],["Pulcherrima","힘 있는","여"],
 ["Charon","또렷한 설명조","남"],["Schedar","고른","남"],["Sadaltager","지적인","남"],["Iapetus","맑은","남"],["Algieba","부드러운","남"],["Rasalgethi","또렷한","남"],["Orus","단단한","남"],["Alnilam","단단한","남"],["Umbriel","편안한","남"],["Achird","친근한","남"],["Enceladus","숨결 있는","남"],["Algenib","허스키한","남"],["Zubenelgenubi","캐주얼한","남"],["Puck","경쾌한","남"],["Fenrir","활기찬","남"],["Sadachbia","생기 있는","남"]];
const STYLES=[
 ["오디오북","차분하고 따뜻한 오디오북 낭독. 문장 사이에 자연스럽게 숨을 쉬고, 중요한 말은 살짝 힘을 주어 천천히 읽는다."],
 ["라디오","늦은 밤 라디오 진행자처럼 다정하고 편안하게, 듣는 사람에게 말을 건네듯 읽는다."],
 ["강의","강의하듯 또렷하고 자신 있게, 핵심 문장은 강조하며 읽는다."],
 ["잠자리","잠들기 전처럼 낮고 잔잔하게, 아주 천천히 속삭이듯 읽는다."]];
const MODELS=[["gemini-3.8-flash-tts","가장 자연스러움"],["gemini-3.8-flash-lite-tts","빠르고 한도 넉넉"]];
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}
const CF=Object.assign({key:"",voice:"Sulafat",style:0,model:MODELS[0][0],rate:1,night:false,schema:"new",engine:"gemini",chirpKey:"",chirpVoice:"Sulafat",chirpUse:{m:"",n:0},localVoice:"F1",localSteps:5,localSrc:"int8",autoNext:true},JSON.parse(lsGet("bookvoice")||"{}"));
if(!CF.key){try{const a=JSON.parse(lsGet("aicall")||"{}");if(a.key)CF.key=a.key}catch(_){}}
const saveCF=()=>lsSet("bookvoice",JSON.stringify(CF));
document.documentElement.classList.toggle("night",!!CF.night);

/* ===== 저장소(IndexedDB): 책·만든 음성 ===== */
let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise((ok,no)=>{const r=indexedDB.open("bookvoice",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("books");d.createObjectStore("audio")};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return dbp}
async function dget(st,k){const d=await idb();return new Promise((ok,no)=>{const r=d.transaction(st).objectStore(st).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function dput(st,k,v){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction(st,"readwrite");t.objectStore(st).put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
async function dall(st){const d=await idb();return new Promise((ok,no)=>{const r=d.transaction(st).objectStore(st).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function ddel(st,k){const d=await idb();return new Promise(ok=>{const t=d.transaction(st,"readwrite");t.objectStore(st).delete(k);t.oncomplete=()=>ok()})}

/* ===== 책 받기: 생각서재가 #b= 로 압축해 보냄 ===== */
function b64uToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function inflate(bytes){const ds=new DecompressionStream("deflate-raw");const out=new Blob([bytes]).stream().pipeThrough(ds);return await new Response(out).text()}
async function importFromHash(){
  const m=location.hash.match(/[#&]b=([^&]+)/);if(!m)return null;
  try{const txt=await inflate(b64uToBytes(m[1]));const bk=JSON.parse(txt);if(!bk.id||!Array.isArray(bk.sections))throw 0;
    const old=await dget("books",bk.id);const sp=location.hash.match(/[#&]s=(\d+)/),pp=location.hash.match(/[#&]p=(\d+)/);
    const hp=sp?{s:+sp[1],p:pp?+pp[1]:0}:null,op=old&&old.pos;
    /* 들었던 곳과 생각서재에서 읽던 곳 중 더 뒤쪽부터 이어 듣기 */
    bk.pos=(op&&(!hp||op.s>hp.s||(op.s===hp.s&&op.p>=hp.p)))?op:(hp||{s:0,p:0});bk.added=Date.now();
    await dput("books",bk.id,bk);history.replaceState(null,"",location.pathname);return bk.id;
  }catch(e){toastStat("책을 불러오지 못했습니다. 생각서재에서 다시 'AI 성우로 듣기'를 눌러 주세요.");return null}
}

/* ===== 화면 ===== */
const $=id=>document.getElementById(id);
function h(tag,a,...kids){const e=document.createElement(tag);if(a)for(const[k,v]of Object.entries(a)){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));return e}
const ST={view:"lib",book:null,flat:[],cur:0,playing:false,url:null,busy:new Map()};
function toastStat(t){$("stat").textContent=t||""}

async function showLib(){
  ST.view="lib";stop();window.scrollTo(0,0);$("player").hidden=true;$("ttl").textContent="생각서재 오디오북";
  const books=(await dall("books")).sort((a,z)=>(z.last||z.added||0)-(a.last||a.added||0));
  const m=$("main");m.replaceChildren(
    CF.engine==="gemini"&&!CF.key&&!CF.chirpKey?keyPanel(true):null,
    h("section",{class:"panel"},h("h2",null,"내 오디오북"),
      books.length?h("div",{class:"lib"},...books.map(b=>h("button",{onclick:()=>openBook(b.id)},h("div",{class:"t"},b.title),h("div",{class:"muted small"},[b.author,`${b.sections.length}개 장`,b.pos&&(b.pos.s||b.pos.p||b.pos.t)?`이어 듣기: ${(b.sections[b.pos.s]||{}).title||""}`:"처음부터"].filter(Boolean).join(" · ")))))
      :h("p",{class:"muted"},"아직 책이 없습니다. 생각서재의 '책 전체보기'에서 '듣기 › AI 성우로 듣기'를 누르면 책이 이곳으로 넘어옵니다.")),
    books.length?h("p",{class:"muted small"},"만든 음성은 이 기기에 저장되어, 다시 들을 때는 무료 한도를 쓰지 않습니다."):null);
}
function keyPanel(first){
  const inp=h("input",{type:"password",placeholder:"AIza로 시작하는 Gemini API 키",value:CF.key||"",autocomplete:"off"});
  return h("section",{class:"panel"},h("h2",null,first?"처음 한 번만: Gemini API 키":"Gemini API 키"),
    h("p",{class:"small"},"Google의 Gemini AI 음성으로 사람처럼 읽어 줍니다. 무료 키는 aistudio.google.com 에서 ‘Get API key’로 1분 안에 만들 수 있습니다. 키는 이 기기에만 저장되고 Google에만 보내집니다."),
    inp,h("div",{class:"row"},h("button",{class:"btn",onclick:()=>{CF.key=inp.value.trim();saveCF();toastStat("");ST.view==="lib"?showLib():showSettings()}},"저장"),h("a",{href:"https://aistudio.google.com/apikey",target:"_blank",rel:"noopener",class:"small"},"키 만들러 가기")));
}
function showSettings(){
  window.scrollTo(0,0);if(ST.view!=="set")ST.prevView=ST.view;ST.view="set";$("ttl").textContent="목소리·설정";
  const E=CF.engine,re=()=>showSettings();
  const engPanel=h("section",{class:"panel"},h("h2",null,"읽어 주는 엔진"),
    h("div",{class:"engs"},...Object.entries(ENGINES).map(([k,v])=>h("button",{class:"eng"+(E===k?" on":""),onclick:()=>{setEngine(k);re()}},
      h("b",null,v.label,engineReady(k)?null:h("span",{class:"need"}," · 설정 필요")),h("span",null,v.sub),
      k==="chirp"&&CF.chirpKey?h("span",{class:"use"},`이번 달 ${chirpUsed().toLocaleString()} / ${CHIRP_FREE.toLocaleString()}자 사용 (이 기기 기준)`):null))),
    h("label",{class:"row small",style:"gap:6px"},h("input",{type:"checkbox",style:"width:auto",checked:CF.autoNext?true:null,onchange:e=>{CF.autoNext=e.target.checked;saveCF()}}),
      "무료 한도가 끝나면 다음 무료 엔진으로 자동으로 이어 읽기 (Gemini → 구글 HD → 기기 안 AI)"));
  const back=h("div",{class:"row",style:"margin-top:16px"},h("button",{class:"btn ghost",onclick:()=>ST.prevView==="book"&&ST.book?(renderBook(),scrollToCur(false)):showLib()},"돌아가기"));
  let body=[];
  if(E==="gemini"){
    const vgrid=h("div",{class:"voices"},...VOICES.map(([n,d,g])=>h("div",{class:"vc"+(CF.voice===n?" on":""),role:"button",tabindex:"0",onclick:e=>{if(e.target.closest(".pv"))return;CF.voice=n;saveCF();clearAhead();re()}},
      h("b",null,n),h("span",null,`${g}성 · ${d}`),h("button",{class:"pv","aria-label":`${n} 들어 보기`,onclick:()=>preview(n)},"▶"))));
    body=[
      h("section",{class:"panel"},h("h2",null,"목소리 고르기"),h("p",{class:"muted small"},"▶로 미리 들어 보고 마음에 드는 목소리를 누르세요. 오디오북에는 Sulafat·Vindemiatrix·Gacrux(여), Charon·Schedar·Sadaltager(남)가 잘 어울립니다."),vgrid),
      h("section",{class:"panel"},h("h2",null,"읽는 분위기"),h("div",{class:"chips"},...STYLES.map(([l],i)=>h("button",{class:"chip"+(CF.style===i?" on":""),onclick:()=>{CF.style=i;saveCF();clearAhead();re()}},l))),h("p",{class:"muted small"},STYLES[CF.style][1])),
      h("section",{class:"panel"},h("h2",null,"음성 모델"),h("div",{class:"chips"},...MODELS.map(([id,l])=>h("button",{class:"chip"+(CF.model===id?" on":""),onclick:()=>{CF.model=id;saveCF();clearAhead();re()}},l))),h("p",{class:"muted small"},"기본 모델의 하루 무료 한도가 끝나면 자동으로 가벼운 모델로 넘어가 이어 읽습니다.")),
    h("section",{class:"panel"},h("h2",null,"끊김 없이 듣기 (결제 연결)"),
      h("p",{class:"small"},"Gemini 앱 구독(Google AI Pro 등)과 API 키는 별개라서, 구독 중이어도 이 키는 ‘무료 등급’으로 쓰입니다. 무료 등급은 하루 사용량이 적어 금방 막힙니다."),
      h("p",{class:"small"},"키가 속한 프로젝트에 결제만 연결하면 같은 키가 그대로 유료 등급이 되어 한도 걱정 없이 들을 수 있습니다."),
      h("ol",{class:"small",style:"padding-left:20px;margin:6px 0"},
        h("li",null,"아래 버튼으로 Google AI Studio의 ‘API 키’ 화면을 엽니다."),
        h("li",null,"지금 쓰는 키가 있는 프로젝트 줄에서 ‘결제 설정(Set up billing)’을 누릅니다."),

/* 문단 여러 개를 한 번에 만들어 요청 수를 줄임(무료 한도 절약) */
const CHUNK_MAX=1400;
function buildChunks(){

    const lim=CF.engine==="local"?0:CHUNK_MAX;const bytes=CF.engine==="chirp"&&cur?new TextEncoder().encode(cur.parts.join("\n\n")+t).length>4600:false;

function speakableText(t){return String(t).replace(/\(([^()]*[㐀-鿿][^()]*)\)/g,"").replace(/[「」『』《》〈〉“”"]/g,"").replace(/\s*[—–]\s*/g,", ").replace(/\s*·\s*/g,", ").replace(/\s*→\s*/g,", 그다음 ").replace(/(\d)\s*~\s*(\d)/g,"$1에서 $2").replace(/\s{2,}/g," ").trim()}

async function tts(text,voice,styleIdx,model){
  if(!CF.key)throw Object.assign(new Error("키 없음"),{code:"nokey"});
  const style=STYLES[styleIdx][1];
  for(let attempt=0;attempt<4;attempt++){
    const bodyNew={contents:[{role:"user",parts:[{text,speech_metadata:{style}}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{voice}}}};
    const bodyOld={contents:[{role:"user",parts:[{text:`${style}\n\n${text}`}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}};
    const body=CF.schema==="old"?bodyOld:bodyNew;
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":CF.key},body:JSON.stringify(body)});
    if(r.status===429){
      const j=await r.json().catch(()=>({}));const raw=JSON.stringify(j);
      const d=((j.error&&j.error.details)||[]).find(x=>x.retryDelay);const sec=d?parseInt(d.retryDelay):30;
      const daily=/PerDay/i.test(raw)||sec>120;
      if(daily&&model!==MODELS[1][0]){ /* 기본 모델 하루 한도 → 가벼운 모델(별도 한도)로 자동 전환 */
        model=MODELS[1][0];CF.model=model;saveCF();renderModelNote();toastStat("기본 모델의 오늘 무료 한도를 다 써서, 같은 목소리의 가벼운 모델로 이어 읽습니다.");continue}
      if(daily&&CF.autoNext&&CF.chirpKey&&chirpUsed()<CHIRP_STOP)throw Object.assign(new Error("switch"),{code:"switch",to:"chirp",why:"오늘 Gemini 무료 한도를 다 써서 구글 HD 음성(같은 목소리 계열)으로 이어 읽습니다."});
      if(daily)throw Object.assign(new Error("오늘 무료 한도를 모두 썼습니다. 한국시간 오후 4~5시에 다시 채워집니다. 바로 이어 들으려면 ‘목소리·설정 › 끊김 없이 듣기(결제 연결)’를 보세요."),{code:"quota"});
      toastStat(`요청이 몰려 ${sec}초 쉬었다가 이어서 만듭니다…`);await sleep(sec*1000);continue}
    if(r.status===400&&CF.schema!=="old"){const j=await r.json().catch(()=>({}));const msg=(j.error&&j.error.message)||"";if(/speech_metadata|voice|Unknown name|Invalid JSON/i.test(msg)){CF.schema="old";saveCF();continue}throw Object.assign(new Error(msg||"요청 오류"),{code:"bad"})}

    if(r.status===401||r.status===403){throw Object.assign(new Error("API 키를 확인해 주세요"),{code:"key"})}
    if(!r.ok){const j=await r.json().catch(()=>({}));throw Object.assign(new Error((j.error&&j.error.message)||("오류 "+r.status)),{code:"http"})}
    const j=await r.json();const part=((((j.candidates||[])[0]||{}).content||{}).parts||[]).find(p=>p.inlineData||p.inline_data);

}

const CHIRP_FREE=1000000,CHIRP_STOP=950000;
const monthKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};

async function chirpTTS(text,voice){
  if(!CF.chirpKey)throw Object.assign(new Error("구글 HD 음성 키를 넣어 주세요 (목소리·설정)."),{code:"nochirp"});
  if(chirpUsed()+text.length>CHIRP_STOP&&CF.autoNext)throw Object.assign(new Error("switch"),{code:"switch",to:"local",why:"이번 달 구글 HD 음성 무료 사용량을 거의 다 써서 기기 안 AI로 이어 읽습니다."});
  if(chirpUsed()+text.length>CHIRP_STOP)throw Object.assign(new Error("이번 달 구글 HD 음성 무료 사용량(100만 자)을 거의 다 썼습니다."),{code:"chirpquota"});
  for(let attempt=0;attempt<3;attempt++){
    const r=await fetch("https://texttospeech.googleapis.com/v1/text:synthesize",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":CF.chirpKey},
      body:JSON.stringify({input:{text},voice:{languageCode:"ko-KR",name:`ko-KR-Chirp3-HD-${voice}`},audioConfig:{audioEncoding:"MP3"}})});
    if(r.status===429){toastStat("요청이 몰려 잠시 쉬었다가 이어서 만듭니다…");await sleep(15000*(attempt+1));continue}
    if(!r.ok){const j=await r.json().catch(()=>({}));const msg=(j.error&&j.error.message)||("오류 "+r.status);
      let hint="";if(/not been used|disabled|SERVICE_DISABLED/i.test(msg))hint="Cloud Text-to-Speech API가 ‘사용’ 상태가 아닙니다. 설정 안내 3번을 확인해 주세요.";
      else if(/billing/i.test(msg))hint="이 프로젝트에 결제 계정이 연결되지 않았습니다. 설정 안내 2번을 확인해 주세요. (무료 사용량 안에서는 0원)";
      else if(/referer|referrer|API key not valid|API_KEY/i.test(msg))hint="키가 맞지 않거나 웹사이트 제한이 다르게 걸려 있습니다. 설정 안내 4번을 확인해 주세요.";

  }

}

const LOCAL_STEPS=[[5,"빠르게"],[8,"보통"],[12,"고품질"]];
const ORT_URL="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
const TONIC={src:null,loading:null,sess:null,cfg:null,idx:null,styles:{},ep:""};
function loadScript(u){return new Promise((ok,no)=>{if(window.ort)return ok();const e=document.createElement("script");e.src=u;e.onload=ok;e.onerror=()=>no(new Error("음성 엔진 프로그램을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."));document.head.append(e)})}
async function fetchCached(url,onProg){
  let cache=null;try{cache=await caches.open("supertonic-v1")}catch(_){}
  if(cache){const hit=await cache.match(url);if(hit){onProg&&onProg(1,1);return new Uint8Array(await hit.arrayBuffer())}}
  const res=await fetch(url);if(!res.ok)throw new Error("모델 파일을 받지 못했습니다 ("+res.status+")");
  const total=+res.headers.get("content-length")||0;const rd=res.body.getReader();const parts=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onProg&&onProg(got,total)}
  const blob=new Blob(parts);if(cache){try{await cache.put(url,new Response(blob))}catch(_){}}
  return new Uint8Array(await blob.arrayBuffer());
}
async function localModelCached(src){try{const c=await caches.open("supertonic-v1");return !!(await c.match(LOCAL_SRC[src].base+"onnx/vector_estimator.onnx"))}catch(_){return false}}
async function tonicLoad(onProg){
  const src=CF.localSrc;if(TONIC.sess&&TONIC.src===src)return;
  if(TONIC.loading&&TONIC.src===src)return TONIC.loading;
  TONIC.src=src;TONIC.sess=null;TONIC.styles={};
  TONIC.loading=(async()=>{
    await loadScript(ORT_URL+"ort.webgpu.min.js");
    ort.env.wasm.wasmPaths=ORT_URL;ort.env.wasm.numThreads=self.crossOriginIsolated?Math.min(4,navigator.hardwareConcurrency||1):1;
    const base=LOCAL_SRC[src].base;
    TONIC.cfg=await (await fetch(base+"onnx/tts.json")).json();
    TONIC.idx=await (await fetch(base+"onnx/unicode_indexer.json")).json();
    const names=["duration_predictor","text_encoder","vector_estimator","vocoder"],w=[4,35,245,97];const wsum=w.reduce((a,b)=>a+b);let done=0;
    const eps=(src==="full"&&navigator.gpu)?["webgpu","wasm"]:["wasm"];TONIC.ep=eps[0];
    const sess=[];
    for(let k=0;k<4;k++){
      const bytes=await fetchCached(base+"onnx/"+names[k]+".onnx",(g,t)=>onProg&&onProg((done+(t?g/t:0)*w[k])/wsum));
      done+=w[k];onProg&&onProg(done/wsum,"준비 중");
      try{sess.push(await ort.InferenceSession.create(bytes,{executionProviders:eps,graphOptimizationLevel:"all"}))}
      catch(e){if(eps[0]!=="wasm"){TONIC.ep="wasm";sess.push(await ort.InferenceSession.create(bytes,{executionProviders:["wasm"],graphOptimizationLevel:"all"}))}else throw e}
    }
    TONIC.sess=sess;
  })();
  try{await TONIC.loading}catch(e){TONIC.src=null;throw e}finally{TONIC.loading=null}
}
async function tonicStyle(name){
  if(TONIC.styles[name])return TONIC.styles[name];
  const j=await (await fetch(LOCAL_SRC[TONIC.src].base+"voice_styles/"+name+".json")).json();
  const t=(o)=>new ort.Tensor("float32",Float32Array.from(o.data.flat(Infinity)),o.dims);
  return TONIC.styles[name]={ttl:t(j.style_ttl),dp:t(j.style_dp)};
}
function tonicPre(text){
  text=text.normalize("NFKD").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]+/gu,"");
  const rp={"–":"-","‑":"-","—":"-","_":" ","“":'"',"”":'"',"‘":"'","’":"'","´":"'","`":"'","[":" ","]":" ","|":" ","/":" ","#":" ","→":" ","←":" "};
  for(const [k,v] of Object.entries(rp))text=text.split(k).join(v);
  text=text.replace(/[♥☆♡©\\]/g,"").replace(/ ([,.!?;:'])/g,"$1").replace(/"{2,}/g,'"').replace(/'{2,}/g,"'").replace(/\s+/g," ").trim();
  if(!/[.!?;:,'"')\]}…。」』】〉》›»]$/.test(text))text+=".";
  return `<ko>${text}</ko>`;
}
function tonicSplit(text,max){
  const out=[];for(const para of text.trim().split(/\n\s*\n+/)){let cur="";
    for(const sen of para.trim().split(/(?<=[.!?])\s+/)){if(!sen)continue;if(cur.length+sen.length+1<=max)cur+=(cur?" ":"")+sen;else{if(cur)out.push(cur);cur=sen}}
    if(cur)out.push(cur)}
  return out;
}
function gauss(){const u=Math.max(1e-4,Math.random()),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
async function tonicInfer(text,st,steps,speed){
  const [dpS,teS,veS,vocS]=TONIC.sess,cfg=TONIC.cfg,idx=TONIC.idx;
  const t=tonicPre(text),L=t.length,ids=new BigInt64Array(L);
  for(let j=0;j<L;j++){const cp=t.codePointAt(j);ids[j]=BigInt(cp<idx.length?idx[cp]:-1)}
  const tIds=new ort.Tensor("int64",ids,[1,L]),tMask=new ort.Tensor("float32",new Float32Array(L).fill(1),[1,1,L]);
  const dur=(await dpS.run({text_ids:tIds,style_dp:st.dp,text_mask:tMask})).duration.data[0]/speed;
  const emb=(await teS.run({text_ids:tIds,style_ttl:st.ttl,text_mask:tMask})).text_emb;
  const sr=cfg.ae.sample_rate,chunk=cfg.ae.base_chunk_size*cfg.ttl.chunk_compress_factor,D=cfg.ttl.latent_dim*cfg.ttl.chunk_compress_factor;
  const wavLen=Math.floor(dur*sr),T=Math.max(1,Math.floor((wavLen+chunk-1)/chunk));
  let x=new Float32Array(D*T);for(let i=0;i<x.length;i++)x[i]=gauss();
  const lm=new ort.Tensor("float32",new Float32Array(T).fill(1),[1,1,T]),tot=new ort.Tensor("float32",new Float32Array([steps]),[1]);
  for(let k=0;k<steps;k++){
    const o=await veS.run({noisy_latent:new ort.Tensor("float32",x,[1,D,T]),text_emb:emb,style_ttl:st.ttl,latent_mask:lm,text_mask:tMask,current_step:new ort.Tensor("float32",new Float32Array([k]),[1]),total_step:tot});
    x=Float32Array.from(o.denoised_latent.data);
  }
  const wav=(await vocS.run({latent:new ort.Tensor("float32",x,[1,D,T])})).wav_tts.data;
  return {pcm:wav.subarray(0,Math.min(wavLen,wav.length)),sr};
}
async function localTTS(text,voice,steps){
  const pr=f=>toastStat(`기기 안 AI 모델 내려받는 중… ${Math.round(f*100)}% (처음 한 번만)`);
  try{await tonicLoad(pr)}catch(e){if(CF.localSrc!=="int8")throw e;CF.localSrc="full";saveCF();toastStat("가벼운 버전을 받을 수 없어 원본으로 받습니다…");await tonicLoad(pr)}
  const st=await tonicStyle(voice);const parts=[];let sr=44100,n=0;
  for(const piece of tonicSplit(text,120)){const r=await tonicInfer(piece,st,steps,1.05);sr=r.sr;parts.push(r.pcm);n+=r.pcm.length}
  const gap=Math.floor(0.3*sr),all=new Float32Array(n+gap*Math.max(0,parts.length-1));let o=0;
  parts.forEach((p,i)=>{all.set(p,o);o+=p.length+(i<parts.length-1?gap:0)});
  const pcm=new Uint8Array(all.length*2),dv=new DataView(pcm.buffer);
  for(let i=0;i<all.length;i++)dv.setInt16(i*2,Math.round(Math.max(-1,Math.min(1,all[i]))*32767),true);
  return wavFromPcm(pcm,sr);
}

/* 엔진별로 한 번에 만드는 분량과 실제 생성 */
function chunkLimit(){return CF.engine==="local"?1:1400}
function synthKey(text){return CF.engine==="gemini"?[CF.model,CF.voice,CF.style,text]:CF.engine==="chirp"?["chirp",CF.chirpVoice,text]:["local",CF.localSrc,CF.localVoice,CF.localSteps,text]}
function synth(text){return CF.engine==="gemini"?tts(text,CF.voice,CF.style,CF.model):CF.engine==="chirp"?chirpTTS(text,CF.chirpVoice):localTTS(text,CF.localVoice,CF.localSteps)}
async function audioForChunk(c){
  const ch=ST.chunks[c];if(!ch)return null;
  const text=ch.parts.filter(Boolean).join("\n\n");if(!text.trim())return null;
  const key=await sha(synthKey(text).join("|"));
  const hit=await dget("audio",key);if(hit)return hit;
  if(ST.busy.has(c))return ST.busy.get(c);
  const p=(async()=>{const blob=await synth(text);await dput("audio",key,blob);return blob})();
  ST.busy.set(c,p);markCur();
  try{return await p}finally{ST.busy.delete(c);markCur()}
}
function prefetch(){const n=CF.engine==="local"?2:1;(async()=>{for(let d=1;d<=n;d++){const c=ST.chunkOf[ST.cur]+d;if(c<ST.chunks.length&&!ST.busy.has(c))await audioForChunk(c).catch(()=>{})}})()}
function clearAhead(){ST.busy.clear();ST.playChunk=null}

/* ===== 재생 ===== */
const au=$("au");
function waitMeta(){return au.readyState>=1?Promise.resolve():new Promise(r=>{au.addEventListener("loadedmetadata",r,{once:true});setTimeout(r,2000)})}
async function playCur(){
  ST.playing=true;updPlayer();markCur();scrollToCur(true);savePos();
  const myCur=ST.cur,c=ST.chunkOf[myCur];
  try{
    if(ST.playChunk!==c||!au.src){
      toastStat(ST.busy.has(c)?"목소리를 만드는 중…":"목소리를 만드는 중… (몇 문단씩 묶어 만들어 처음 한 번은 10~20초 걸립니다)");
      const blob=await audioForChunk(c);
      if(!ST.playing||ST.cur!==myCur)return;
      if(!blob){ST.cur=ST.chunks[c].to;next();return}
      if(ST.url)URL.revokeObjectURL(ST.url);ST.url=URL.createObjectURL(blob);
      au.src=ST.url;ST.playChunk=c;await waitMeta();
    }
    toastStat(ST.note||"");ST.note=null;
    au.playbackRate=CF.rate;au.preservesPitch=true;
    const t=ST.resumeT;ST.resumeT=0;
    if(au.duration){au.currentTime=t&&t<au.duration-1?t:au.duration*fracOf(myCur)}
    await au.play();prefetch();mediaMeta();
  }catch(e){
    if(e.code==="switch"){setEngine(e.to,e.why);ST.resumeT=0;ST.note=e.why;if(ST.playing)playCur();return}
    ST.playing=false;updPlayer();
    const needKey=e.code==="nokey"||e.code==="key"||e.code==="nochirp";
    toastStat(e.code==="nokey"||e.code==="key"?"Gemini API 키를 넣어 주세요 (목소리·설정).":e.message);if(needKey)showSettings()}
}
au.addEventListener("ended",()=>{if(!ST.playing||ST.playChunk==null)return;const ch=ST.chunks[ST.playChunk];
  if(ch.to>=ST.flat.length-1){stop();ST.cur=ch.to;toastStat("끝까지 들었습니다.");return}
  ST.cur=ch.to+1;savePos();setTimeout(()=>{if(ST.playing)playCur()},400)});
au.addEventListener("timeupdate",()=>{
  if(au.duration)$("ptr").style.width=(au.currentTime/au.duration*100)+"%";
  if(!ST.playing||ST.playChunk==null||!au.duration||au.paused)return;
  const i=paraAt(ST.playChunk,au.currentTime/au.duration);
  if(i!==ST.cur){ST.cur=i;markCur();updPlayer();scrollToCur(true);mediaMeta()}
  if(Date.now()-(ST.lastSave||0)>4000){ST.lastSave=Date.now();savePos()}});
function goPara(i){
  ST.resumeT=0;ST.cur=Math.max(0,Math.min(ST.flat.length-1,i));savePos();
  if(ST.playChunk===ST.chunkOf[ST.cur]&&au.duration){au.currentTime=au.duration*fracOf(ST.cur);markCur();updPlayer();scrollToCur(true);if(ST.playing&&au.paused)au.play();return}
  au.pause();ST.playChunk=null;
  ST.playing?playCur():(markCur(),updPlayer(),scrollToCur(true));
}
function next(){if(ST.cur>=ST.flat.length-1){stop();toastStat("끝까지 들었습니다.");return}goPara(ST.cur+1)}
function prev(){goPara(ST.cur-1)}
function jump(i){ST.playing=true;goPara(i);if(!(ST.playChunk===ST.chunkOf[i]&&au.duration))return}
function stop(){ST.playing=false;au.pause();updPlayer()}
function toggle(){if(ST.playing){ST.playing=false;au.pause();savePos();updPlayer()}
  else if(au.src&&ST.playChunk===ST.chunkOf[ST.cur]&&!au.ended&&!ST.resumeT){ST.playing=true;au.play();updPlayer()}else playCur()}
function updPlayer(){
  if(!ST.book)return;const x=ST.flat[ST.cur]||{};
  $("pnow").textContent=x.sec||"";$("ppos").textContent=`${ST.cur+1} / ${ST.flat.length}`;
  $("play").textContent=ST.playing?"❚❚":"▶";$("play").setAttribute("aria-label",ST.playing?"일시정지":"재생");
  $("rate").value=String(CF.rate);
}
$("play").onclick=toggle;$("next").onclick=next;$("prev").onclick=prev;
$("back15").onclick=()=>{if(au.src&&ST.playChunk!=null&&au.currentTime>3){au.currentTime=Math.max(0,au.currentTime-15)}else prev()};
$("rate").onchange=e=>{CF.rate=+e.target.value;saveCF();au.playbackRate=CF.rate};
function mediaMeta(){if(!("mediaSession" in navigator)||!ST.book)return;const x=ST.flat[ST.cur];
  navigator.mediaSession.metadata=new MediaMetadata({title:x.sec,artist:ST.book.title,album:"생각서재 오디오북"});
  navigator.mediaSession.setActionHandler("play",toggle);navigator.mediaSession.setActionHandler("pause",toggle);
  navigator.mediaSession.setActionHandler("nexttrack",next);navigator.mediaSession.setActionHandler("previoustrack",prev)}

/* 미리 듣기 */
const PV_TEXT="사람을 움직이는 힘은 말솜씨가 아니라, 상대를 먼저 듣는 데서 나옵니다. 오늘은 그 이야기를 천천히 나눠 보겠습니다.";
async function preview(v){
  const E=CF.engine;toastStat(E==="local"?"기기 안 AI로 만드는 중…":`${v} 목소리를 만드는 중…`);$("player").hidden=!ST.book;
  try{const key=await sha(["pv",E,E==="gemini"?CF.model+CF.style:E==="local"?CF.localSrc+CF.localSteps:"",v].join("|"));let blob=await dget("audio",key);
    if(!blob){blob=E==="gemini"?await tts(PV_TEXT,v,CF.style,CF.model):E==="chirp"?await chirpTTS(PV_TEXT,v):await localTTS(PV_TEXT,v,CF.localSteps);await dput("audio",key,blob)}
    stop();ST.playChunk=null;const u=URL.createObjectURL(blob);au.src=u;au.playbackRate=CF.rate;await au.play();toastStat(`${v} 미리 듣기`);
  }catch(e){toastStat(e.code==="switch"?"무료 한도가 끝나 미리 듣기를 할 수 없습니다.":e.message)}
}

$("libBtn").onclick=showLib;$("setBtn").onclick=showSettings;
$("nightBtn").onclick=()=>{CF.night=!CF.night;saveCF();document.documentElement.classList.toggle("night",CF.night);$("nightBtn").classList.toggle("on",CF.night)};
$("nightBtn").classList.toggle("on",!!CF.night);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")savePos()});window.addEventListener("pagehide",()=>{savePos()});

window.addEventListener("hashchange",async()=>{const id=await importFromHash();if(id)openBook(id)});
(async()=>{
  const id=await importFromHash();
  if(id)openBook(id);else showLib();
  if(id&&!CF.key)setTimeout(showSettings,400);
})();
